spring:
  application:
    name: breaking-business-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/financial_platform}
    username: ${DB_USERNAME:financial_app}
    password: ${DB_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-before-deploying}
    ttl-minutes: ${JWT_TTL_MINUTES:480}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  password-reset:
    ttl-minutes: ${PASSWORD_RESET_TTL_MINUTES:30}
    # Local development only. Set false when an email delivery service is connected.
    expose-token: ${PASSWORD_RESET_EXPOSE_TOKEN:true}
  seed:
    enabled: ${SEED_DEFAULT_USERS:true}
    default-password: ${SEED_DEFAULT_PASSWORD:ChangeMe123!}

server:
  error:
    include-message: never
